<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="OC Ferry — 把 OpenCode 的免费模型摆渡给 WorkBuddy">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="50%" stop-color="#131a28"/>
      <stop offset="100%" stop-color="#0c111a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#bcd4ff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1080" cy="30" r="340" fill="url(#glowA)"/>
  <circle cx="170" cy="320" r="300" fill="url(#glowB)"/>

  <text x="640" y="168" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="1.5" fill="url(#titleGrad)">OC Ferry</text>

  <rect x="452" y="198" width="376" height="2" rx="1" fill="url(#ruleGrad)"/>

  <text x="640" y="242" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="23" fill="#9db2d0">把 OpenCode 的免费模型摆渡给 WorkBuddy</text>

  <path d="M 0 292 Q 160 274 320 292 T 640 292 T 960 292 T 1280 292" fill="none" stroke="url(#waveGrad)" stroke-width="1.5"/>
</svg>
